name: CI

# Runs the Playwright suite, then publishes to Pages only if it passed.
# Deploying an unverified page would defeat the point of having the suite: the
# claims on this page are the product, and a broken one should not go live.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only by default; the deploy job asks for exactly what it needs.
permissions:
  contents: read

# A superseded run has nothing useful left to say, but let an in-flight deploy
# finish rather than leaving Pages half-published.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        working-directory: tests
        run: npm ci

      # Only Chromium: the suite asserts layout, contrast and semantics, none
      # of which a second engine would answer differently for the cost of the
      # download. Cross-browser belongs in a scheduled run, not on every push.
      - name: Install Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Run the suite
        working-directory: tests
        run: npx playwright test

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # The site is the repository root. Nothing is compiled, so the artifact
      # is the working tree minus the things that are not part of the site.
      - name: Stage the site
        run: |
          rm -rf tests scripts .github .cache
          touch .nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
